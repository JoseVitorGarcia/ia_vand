# Servidor do protótipo estático do VAND.
#
# Duas regras aqui não são detalhe e quebram o app se saírem:
#  - sw.js NUNCA pode ser cacheado pelo HTTP. Se for, o navegador continua
#    executando o service worker velho e o app nunca atualiza.
#  - .webmanifest precisa do tipo correto, senão o Chrome ignora o manifesto e
#    não oferece instalar na tela inicial.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # O Chrome ignora o manifesto se o tipo não for este. `types {}` vazio
    # limita a troca a esta location e preserva a tabela global.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # O service worker precisa ser sempre revalidado. E o navegador RECUSA
    # registrar um service worker que não venha com tipo JavaScript.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML, CSS e JS revalidam a cada carga; quem faz o cache de verdade é o
    # service worker, e ele conhece a própria versão.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Ícones mudam raramente.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O roteamento é por hash (#/estudar/...), então o servidor só precisa
    # devolver o index quando o caminho não existir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
