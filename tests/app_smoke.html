<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>smoke</title>
<link rel="stylesheet" href="../app/styles.css">
<style>#saida { position: relative; z-index: 99; background: #fff; }</style>
</head><body>
<div class="app">

  <header class="topbar" id="topbar">
    <button type="button" class="backbtn" id="voltar" hidden aria-label="Voltar">←</button>
    <div class="topbar-marca" role="img" aria-label="IA_VAND"></div>
    <p class="topbar-titulo" id="topbar-titulo" aria-hidden="true"></p>
    <div class="progresso-leitura" id="progresso-leitura" aria-hidden="true"></div>
  </header>

  <main class="conteudo" id="conteudo" tabindex="-1">
    <div class="wrap" id="tela"></div>
  </main>

  <nav class="tabbar" aria-label="Seções do aplicativo">
    <button type="button" data-aba="alerta"><span class="ico-slot"></span>Alerta<span class="selo" id="selo-alerta" aria-hidden="true"></span></button>
    <button type="button" data-aba="registro"><span class="ico-slot"></span>Registro</button>
    <button type="button" data-aba="estudar"><span class="ico-slot"></span>Estudar</button>
  </nav>

</div>
<pre id="saida"></pre>
<script src="../app/content.js"></script>
<script src="../app/dados.js"></script>
<script src="../app/app.js"></script>
<script>
var log = [];
function ok(cond, msg) { log.push((cond ? 'PASS ' : 'FALHA ') + msg); }

function irPara(hash) {
  location.hash = hash;
  window.dispatchEvent(new HashChangeEvent('hashchange'));
}

// Um clique que NAVEGA só muda location.hash; o evento hashchange do navegador
// é assíncrono e não teria chegado até a próxima asserção. irPara dispara o
// evento à mão, e cliques de navegação precisam do mesmo tratamento.
// Cliques que apenas re-renderizam no lugar (alternativas do quiz, "próxima
// questão", "refazer") NÃO passam por aqui — eles não mexem no hash.
function clicarNavegando(seletor) {
  document.querySelector(seletor).click();
  window.dispatchEvent(new HashChangeEvent('hashchange'));
}

// --- regras de forma dos textos de estudo (spec 2026-10-18) ---
var TRAVESSAO = /[—–]/;

// Texto que o usuário lê, sem o aviso do INMET (texto original, sem edição).
function textoVisivel() {
  var tela = document.getElementById('tela').cloneNode(true);
  [].forEach.call(tela.querySelectorAll('.aviso-card'), function (n) { n.parentNode.removeChild(n); });
  return document.getElementById('topbar').textContent + ' ' + tela.textContent;
}

function checarTemaMigrado(id) {
  var tema = window.VAND_CONTENT.trilha.filter(function (t) { return t.id === id; })[0];
  var nome = '[forma ' + id + '] ';
  ok(!TRAVESSAO.test(JSON.stringify(tema)), nome + 'conteúdo sem travessão');
  var base = '#/estudar/' + id;
  var rotas = [base];
  tema.secoes.forEach(function (s, i) {
    ok(s.tipo === 'blocos', nome + 'Seção ' + (i + 1) + ' é do tipo blocos');
    var tipos = {};
    (s.blocos || []).forEach(function (b) {
      tipos[b.tipo] = true;
      if (b.tipo === 'p') {
        var n = b.texto.trim().split(/\s+/).length;
        ok(n <= 45, nome + 'Seção ' + (i + 1) + ': parágrafo de ' + n + ' palavras (máx. 45)');
      }
    });
    ok(Object.keys(tipos).length >= 2, nome + 'Seção ' + (i + 1) + ' mistura ao menos 2 tipos de bloco');
    rotas.push(base + '/s/' + (i + 1));
  });
  rotas.push(base + '/pensar', base + '/fontes', base + '/quiz');
  rotas.forEach(function (rota) {
    irPara(rota);
    ok(!TRAVESSAO.test(textoVisivel()), nome + 'texto visível sem travessão em ' + rota);
  });
}

function percorre(tema) {
  var nome = '[' + tema.id + '] ';
  var base = '#/estudar/' + tema.id;

  // --- índice ---
  irPara(base);
  ok(!document.getElementById('voltar').hidden, nome + 'botao voltar aparece');
  ok(!!document.querySelector('.tema-indice'), nome + 'indice do Tema renderiza');
  ok(document.querySelectorAll('.indice-item').length === tema.secoes.length + 3,
     nome + 'indice lista as ' + tema.secoes.length + ' secoes + pensar, fontes e quiz');
  // Alvo de toque: o brief exige 44px mínimos, e isto é interface de emergência.
  var itens = document.querySelectorAll('.indice-item');
  var baixos = 0;
  for (var k = 0; k < itens.length; k++) if (itens[k].offsetHeight < 44) baixos++;
  ok(baixos === 0, nome + 'todo item do indice tem ao menos 44px de altura');
  ok(document.querySelectorAll('#tela .secao').length === 0,
     nome + 'indice NAO despeja o texto das secoes');

  // --- percorre as Seções pelo encadeamento ---
  for (var i = 0; i < tema.secoes.length; i++) {
    irPara(base + '/s/' + (i + 1));
    ok(document.querySelectorAll('#tela .secao').length === 1,
       nome + 'secao ' + (i + 1) + ' renderiza uma secao por tela');
    var s = tema.secoes[i];
    if (s.tipo === 'glossario') {
      ok(document.querySelectorAll('.glossario .termo').length === s.termos.length,
         nome + 'glossario exibe os ' + s.termos.length + ' termos');
    }
    clicarNavegando('.encadeia');
  }

  // O encadeamento da última Seção leva a Para pensar.
  ok(tema.reflexoes.length > 0 && document.querySelectorAll('.reflexao').length === tema.reflexoes.length,
     nome + 'as ' + tema.reflexoes.length + ' reflexoes aparecem em Para pensar');

  // --- rota inválida cai no índice, em vez de tela em branco ---
  irPara(base + '/s/999');
  ok(!!document.querySelector('.tema-indice'), nome + 'secao fora de faixa cai no indice');
  irPara(base + '/inventado');
  ok(!!document.querySelector('.tema-indice'), nome + 'palavra-chave desconhecida cai no indice');

  // --- o índice agora marca tudo lido ---
  irPara(base);
  ok(document.querySelectorAll('.indice-item.lida').length === tema.secoes.length,
     nome + 'indice marca as ' + tema.secoes.length + ' secoes como lidas');

  // --- fontes ---
  irPara(base + '/fontes');
  ok(document.querySelectorAll('.fontes li').length === tema.fontes.length,
     nome + 'as ' + tema.fontes.length + ' fontes declaradas');

  // --- quiz, acertando tudo ---
  irPara(base + '/quiz');
  var total = tema.quiz.length;
  for (var q = 0; q < total; q++) {
    var alts = document.querySelectorAll('.quiz .alt');
    ok(alts.length === 4, nome + 'questao ' + (q + 1) + ' tem 4 alternativas');
    alts[tema.quiz[q].correta].click();
    ok(!!document.querySelector('.explica.certa'), nome + 'questao ' + (q + 1) + ' aceitou a correta');
    document.querySelector('.quiz .btn').click();
  }
  var score = document.querySelector('.resultado .score');
  ok(score && score.textContent === total + '/' + total, nome + 'resultado mostra ' + total + '/' + total);
  ok(document.querySelectorAll('.resultado ~ .btn-row .btn').length === 3,
     nome + 'resultado oferece voltar ao Tema, voltar a trilha e refazer');
  var salvo = JSON.parse(localStorage.getItem('IA_VAND.progresso.v1'))[tema.id];
  ok(salvo && salvo.acertos === total, nome + 'progresso gravado no localStorage');
  ok(salvo.lidas.length === tema.secoes.length, nome + 'as secoes lidas seguem gravadas');

  // --- refaz errando tudo: o melhor resultado não pode piorar ---
  document.querySelectorAll('.btn-row .btn')[2].click();
  for (var q2 = 0; q2 < total; q2++) {
    var a2 = document.querySelectorAll('.quiz .alt');
    a2[(tema.quiz[q2].correta + 1) % 4].click();
    if (q2 === 0) ok(!!document.querySelector('.explica.errada'), nome + 'resposta errada sinalizada');
    document.querySelector('.quiz .btn').click();
  }
  var depois = JSON.parse(localStorage.getItem('IA_VAND.progresso.v1'))[tema.id];
  ok(depois.acertos === total,
     nome + 'refazer pior nao apaga o melhor resultado (ficou ' + depois.acertos + ')');
}

try {
  localStorage.removeItem('IA_VAND.progresso.v1');

  // Shell: quem rola é #conteudo, nunca o documento.
  var conteudoEl = document.getElementById('conteudo');
  ok(getComputedStyle(conteudoEl).overflowY === 'auto', '#conteudo e o elemento rolavel (overflow-y: auto)');

  var trilha = window.VAND_CONTENT.trilha;
  var escritos = trilha.filter(function (t) { return t.secoes.length > 0; });
  var vazios = trilha.length - escritos.length;

  irPara('#/estudar');
  ok(document.querySelectorAll('.tema-card').length === trilha.length,
     'trilha lista os ' + trilha.length + ' temas');
  ok(document.querySelectorAll('.tema-card[disabled]').length === vazios,
     'os ' + vazios + ' temas ainda sem conteudo estao desabilitados');
  ok(escritos.length > 0, 'ha ao menos um Tema escrito para percorrer');

  // Uma entrada só de leitura (sem quiz) não pode contar como Tema concluído,
  // nem produzir "quiz: undefined de undefined" no cartão.
  (function () {
    var alvo = escritos[0].id;
    localStorage.setItem('IA_VAND.progresso.v1', JSON.stringify(
      (function () { var o = {}; o[alvo] = { lidas: [0] }; return o; })()
    ));
    irPara('#/estudar');
    var card = document.querySelectorAll('.tema-card')[0];
    ok(card.textContent.indexOf('undefined') === -1,
       'cartao de Tema so lido nao mostra "undefined"');
    ok(card.textContent.indexOf('1 de ' + escritos[0].secoes.length + ' seções') > -1,
       'cartao de Tema so lido mostra o progresso de leitura');
    var painel = document.querySelector('.painel .fracao span');
    ok(painel && painel.textContent.indexOf('0/') === 0,
       'barra da Trilha nao conta Tema so lido como concluido');
    localStorage.removeItem('IA_VAND.progresso.v1');
  })();

  escritos.forEach(percorre);

  // Aba Alerta: a rota padrão segue o DADO (colheita diária), então as asserções
  // detalhadas do aviso usam #/alerta/exemplo, que é fixo.
  irPara('#/alerta');
  var haAviso = !!(window.VAND_DADOS && window.VAND_DADOS.aviso);
  ok(!!document.querySelector(haAviso ? '.aviso-card' : '.card-calmo'),
     'aba Alerta segue o dado: ' + (haAviso ? 'aviso vigente' : 'card calmo'));

  // Sem aviso no dado, a rota padrão mostra o card calmo (e o link de exemplo funciona).
  var avisoReal = window.VAND_DADOS.aviso, lacunaReal = window.VAND_DADOS.lacuna;
  window.VAND_DADOS.aviso = null;
  irPara('#/alerta/calmo');
  irPara('#/alerta');
  ok(!!document.querySelector('.card-calmo'), 'dado sem aviso: rota padrão mostra .card-calmo');
  ok(document.querySelector('.link-exemplo').getAttribute('href') === '#/alerta/exemplo',
     'link do card calmo aponta para #/alerta/exemplo');
  window.VAND_DADOS.aviso = avisoReal;

  // Aviso vigente com severidade fora da tabela de lacuna: sem card de lacuna, sem exceção.
  // (Num dia sem aviso no dado, o exemplo faz as vezes dele para o ramo rodar sempre.)
  window.VAND_DADOS.aviso = avisoReal || window.VAND_DADOS.aviso_exemplo;
  window.VAND_DADOS.lacuna = null;
  irPara('#/alerta/calmo');
  irPara('#/alerta');
  ok(!!document.querySelector('.aviso-card') && !document.querySelector('.lacuna-card'),
     'lacuna null: aviso aparece sem card de lacuna');
  window.VAND_DADOS.aviso = avisoReal;
  window.VAND_DADOS.lacuna = lacunaReal;

  // Aviso de exemplo (55157), fixo.
  irPara('#/alerta/exemplo');
  ok(document.body.textContent.indexOf('EXEMPLO HISTÓRICO') > -1, 'exemplo traz o rótulo EXEMPLO HISTÓRICO');
  ok(!!document.querySelector('.lacuna-card'), 'exemplo mostra o card de lacuna');
  var cartaoPrevisao = document.querySelector('.previsao-card');
  ok(cartaoPrevisao && cartaoPrevisao.textContent.indexOf('indica risco') === -1 &&
     cartaoPrevisao.textContent.indexOf('não calcula a Previsão de hoje') > -1,
     'card de Previsão não afirma risco de hoje: apresenta a regra histórica');
  ok(!!document.querySelector('.aviso-card'), 'aba Alerta renderiza .aviso-card');
  ok(!!document.querySelector('.sev-chip'), 'chip de severidade existe');
  ok(document.querySelector('.sev-chip').textContent.indexOf('Grande Perigo') > -1, 'chip mostra "Grande Perigo"');
  ok(document.querySelectorAll('.aviso-bloco')[0].querySelectorAll('li').length === 5, 'existem 5 itens de instrução');
  ok(document.querySelectorAll('.aviso-bloco')[1].querySelectorAll('li').length === 1, 'existe 1 item de risco');
  ok(!!document.querySelector('a[href^="tel:"]'), 'telefone da Defesa Civil vira link tel:');

  // Aba Alerta sem aviso (calmo).
  irPara('#/alerta/calmo');
  ok(!!document.querySelector('.card-calmo'), 'aba Alerta calmo renderiza .card-calmo');
  ok(!document.querySelector('.aviso-card'), 'aba Alerta calmo não renderiza .aviso-card');
  // O card calmo não garante a ausência do aviso "agora": ancora na última consulta.
  var textoCalmo = document.querySelector('.card-calmo').textContent;
  ok(textoCalmo.indexOf('neste momento') === -1 && textoCalmo.indexOf('última consulta') > -1,
     'card calmo fala da última consulta, não de "neste momento"');

  // Aba Registro com pergunta.
  irPara('#/registro');
  var botoes = document.querySelectorAll('.resp');
  ok(botoes.length === 3, 'aba Registro renderiza exatamente 3 botões .resp');
  var altura1 = botoes[0].offsetHeight;
  var altura2 = botoes[1].offsetHeight;
  var altura3 = botoes[2].offsetHeight;
  ok(altura1 === altura2 && altura2 === altura3, 'os 3 botões têm a mesma offsetHeight (peso visual igual)');

  // Aba Registro enviado (confirmação).
  irPara('#/registro/enviado');
  ok(!!document.querySelector('.registro-recibo'), 'aba Registro enviado renderiza .registro-recibo');

  // Volta a trilha: o selo de progresso aparece em cada Tema percorrido.
  irPara('#/estudar');
  ok(document.querySelectorAll('.selo-feito').length === escritos.length,
     'trilha mostra o resultado guardado dos ' + escritos.length + ' temas percorridos');

  // --- blocos de Seção: renderização, com um Tema de fixture ---
  var temaFixture = {
    id: 'fixture-blocos', titulo: 'Fixture', nivel: 'Básico', minutos: 1, resumo: 'x',
    secoes: [{
      tipo: 'blocos', titulo: 'Seção de teste',
      blocos: [
        { tipo: 'p', texto: 'Um parágrafo curto.' },
        { tipo: 'lista', itens: ['um', 'dois', 'três'] },
        { tipo: 'lista', ordenada: true, itens: ['a', 'b'] },
        { tipo: 'passos', itens: [
          { rotulo: '1', titulo: 'Primeiro', texto: 'Texto do primeiro.' },
          { rotulo: 'Minuto zero', texto: 'Rótulo longo, sem título.' } ] },
        { tipo: 'comparacao', lados: [
          { titulo: 'Lado A', itens: ['a1', 'a2'] }, { titulo: 'Lado B', itens: ['b1'] } ] },
        { tipo: 'pergunta', pergunta: 'Por quê?', resposta: 'Porque sim.' },
        { tipo: 'numeros', itens: [{ valor: '97%', rotulo: 'salgada' }, { rotulo: 'largo', largo: true }], nota: 'Nota.' },
        { tipo: 'destaque', texto: 'Destaque sem título.' },
        { tipo: 'destaque', titulo: 'Com título', texto: 'Destaque com título.' },
        { tipo: 'glossario', termos: [{ palavra: 'Termo', definicao: 'Definição.' }], nota: 'Nota do glossário.' },
        { tipo: 'inexistente', texto: 'bloco que o app não conhece' },
        { tipo: 'p', texto: 'Último parágrafo, depois do bloco desconhecido.' }
      ]
    }],
    reflexoes: [], quiz: [{ pergunta: 'q', alternativas: ['a', 'b', 'c', 'd'], correta: 0, explicacao: 'e' }], fontes: []
  };
  window.VAND_CONTENT.trilha.push(temaFixture);
  irPara('#/estudar/fixture-blocos/s/1');
  var secFx = document.querySelector('#tela .secao');
  ok(!!secFx, 'blocos: a Seção renderiza');
  secFx = secFx || document.createElement('div');
  ok(secFx.querySelectorAll('.bloco-p').length === 2, 'blocos: p renderiza (e segue depois do bloco desconhecido)');
  ok(!!secFx.querySelector('ul.bloco-lista') && secFx.querySelectorAll('ul.bloco-lista li').length === 3, 'blocos: lista com 3 itens');
  ok(secFx.querySelectorAll('ol.bloco-lista li').length === 2, 'blocos: lista ordenada usa <ol>');
  ok(secFx.querySelectorAll('ol.bloco-passos > li').length === 2, 'blocos: passos renderiza 2 passos');
  ok(!!secFx.querySelector('.bloco-passos .passo-marca') && secFx.querySelector('.bloco-passos .passo-marca').textContent === '1',
     'blocos: rótulo curto vai no círculo do passo');
  ok(secFx.textContent.indexOf('Minuto zero') > -1 && secFx.querySelectorAll('.passo-marca.ponto').length === 1,
     'blocos: rótulo longo vira texto com marcador de ponto');
  ok(secFx.querySelectorAll('.bloco-comparacao .comp-lado').length === 2 && !!secFx.querySelector('.comp-x'),
     'blocos: comparacao tem 2 lados e o separador');
  var detFx = secFx.querySelector('details.bloco-pergunta');
  ok(!!detFx && detFx.open === false, 'blocos: pergunta começa fechada');
  ok(!!detFx && detFx.querySelector('summary').offsetHeight >= 44, 'blocos: o summary da pergunta tem alvo de toque de 44px');
  if (detFx) detFx.querySelector('summary').click();
  ok(!!detFx && detFx.open === true, 'blocos: tocar no summary abre a resposta');
  ok(secFx.querySelectorAll('.bloco-numeros .dado').length === 2 && !!secFx.querySelector('.bloco-numeros .nota'),
     'blocos: numeros renderiza os itens e a nota');
  ok(secFx.querySelectorAll('.destaque').length === 2 && secFx.querySelectorAll('.destaque h3').length === 1,
     'blocos: destaque aceita ter ou não ter título');
  ok(secFx.querySelectorAll('.bloco-glossario .termo').length === 1 && !!secFx.querySelector('.bloco-glossario .nota'),
     'blocos: glossario renderiza termo e nota');
  ok(secFx.textContent.indexOf('bloco que o app não conhece') === -1, 'blocos: bloco desconhecido é ignorado, sem derrubar a Seção');
  window.VAND_CONTENT.trilha.pop();

  checarTemaMigrado('clima-em-mudanca-e-risco-na-cidade');
  checarTemaMigrado('quando-a-chuva-vira-enchente');
  checarTemaMigrado('de-onde-vem-a-chuva');

  // Texto de interface sem travessão. As telas que só mostram certas frases com dado
  // presente (card de lacuna, Registro com aviso) são exercitadas com o exemplo.
  var avisoOriginal = window.VAND_DADOS.aviso;
  window.VAND_DADOS.aviso = window.VAND_DADOS.aviso_exemplo;
  ['#/alerta', '#/alerta/calmo', '#/alerta/exemplo', '#/registro', '#/registro/enviado',
   '#/estudar', '#/estudar/sobre'].forEach(function (rota) {
    irPara(rota);
    ok(!TRAVESSAO.test(textoVisivel()), 'interface sem travessão em ' + rota);
  });
  window.VAND_DADOS.aviso = avisoOriginal;

  // A logo (sem o ponto vermelho, ADR 0003) mora no cabeçalho fixo de TODA tela.
  ['#/alerta', '#/alerta/exemplo', '#/registro', '#/estudar', '#/estudar/sobre',
   '#/estudar/' + escritos[0].id].forEach(function (rota) {
    irPara(rota);
    var marca = document.querySelector('#topbar .topbar-marca');
    ok(!!marca && marca.getAttribute('aria-label') === 'IA_VAND',
       'cabeçalho tem a logo em ' + rota);
    ok(!!marca && marca.offsetHeight > 0 && marca.offsetWidth > 0,
       'logo visível (com tamanho) em ' + rota);
    ok(!!marca && getComputedStyle(marca).backgroundImage.indexOf('logo-sem-ponto') > -1,
       'logo do cabeçalho é a variante sem ponto em ' + rota);
  });

  // Estudar não repete a logo no corpo da tela (o cabeçalho já a mostra); só a
  // tela "Sobre o VAND" guarda a logo grande, com o ponto.
  irPara('#/estudar');
  ok(!document.querySelector('#tela .marca'), 'Trilha não tem logo grande no corpo');
  ok(!!document.querySelector('#tela .hero p'), 'Trilha mantém o texto de apresentação');
  irPara('#/estudar/sobre');
  ok(!!document.querySelector('#tela .hero .marca'), 'Sobre o VAND mantém a logo grande');
  var titulosSobre = [].map.call(document.querySelectorAll('#tela .secao h2'), function (h) { return h.textContent; });
  ok(titulosSobre.join('|') === 'O que é o VAND|De onde viemos|Onde estamos|Aonde queremos chegar',
     'Sobre tem as 4 seções, na ordem: ' + titulosSobre.join('|'));
  var textoSobre = document.getElementById('tela').textContent;
  ['Instituto Nacional de Meteorologia', 'Centro Europeu de Previsão do Tempo a Médio Prazo',
   'Salão de Iniciação Científica'].forEach(function (nome) {
    ok(textoSobre.indexOf(nome) > -1, 'Sobre dá o nome por extenso: ' + nome);
  });
  ok(textoSobre.indexOf('retransmitir os avisos que o próprio INMET emite') > -1,
     'Sobre explica a mudança: retransmite os avisos do INMET');
  ok(textoSobre.indexOf('As análises feitas por conta própria não foram suficientes') > -1,
     'Sobre conta que as análises próprias não bastaram');
  ok(textoSobre.indexOf('O protótipo ainda não envia notificações') > -1,
     'Sobre não promete notificação que o protótipo não faz');
  ok(!!document.querySelector('#tela a[href="tel:199"]') && !!document.querySelector('#tela a[href="tel:193"]'),
     'Sobre traz os telefones da Defesa Civil e dos Bombeiros como link');
} catch (e) {
  log.push('FALHA excecao: ' + (e && e.message) + ' | ' + (e && e.stack || '').split('\n')[1]);
}
document.getElementById('saida').textContent = 'RESULTADO\n' + log.join('\n');
</script></body></html>
