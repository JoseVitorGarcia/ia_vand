<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>smoke</title></head><body>
<nav class="tabbar"><button data-aba="alerta"></button><button data-aba="registro"></button><button data-aba="estudar"></button></nav>
<header class="topbar"><button class="backbtn" id="voltar" hidden></button><h1 id="titulo"><span class="sub" id="subtitulo"></span></h1></header>
<main class="wrap" id="tela" tabindex="-1"></main>
<pre id="saida"></pre>
<script src="../app/content.js"></script>
<script src="../app/app.js"></script>
<script>
var log = [];
function ok(cond, msg) { log.push((cond ? 'PASS ' : 'FALHA ') + msg); }

function irPara(hash) {
  location.hash = hash;
  window.dispatchEvent(new HashChangeEvent('hashchange'));
}

// Percorre um Tema inteiro: secoes, reflexoes, fontes, quiz certo, quiz errado.
// Vale para qualquer Tema escrito — Tema novo nao pede teste novo.
function percorre(tema) {
  var nome = '[' + tema.id + '] ';
  irPara('#/estudar/' + tema.id);

  ok(!document.getElementById('voltar').hidden, nome + 'botao voltar aparece');
  ok(document.querySelectorAll('#tela > .secao:not(.reflexoes)').length === tema.secoes.length,
     nome + 'as ' + tema.secoes.length + ' secoes renderizaram (todos os tipos declarados)');
  ok(document.querySelectorAll('.reflexao').length === tema.reflexoes.length,
     nome + 'as ' + tema.reflexoes.length + ' reflexoes aparecem');
  ok(document.querySelectorAll('.fontes li').length === tema.fontes.length,
     nome + 'as ' + tema.fontes.length + ' fontes declaradas');

  // Cada seccao de glossario exibe todos os seus termos.
  tema.secoes.forEach(function (s) {
    if (s.tipo === 'glossario') {
      ok(document.querySelectorAll('.glossario .termo').length === s.termos.length,
         nome + 'glossario exibe os ' + s.termos.length + ' termos');
    }
  });

  // Acerta tudo.
  var total = tema.quiz.length;
  for (var q = 0; q < total; q++) {
    var alts = document.querySelectorAll('.quiz .alt');
    ok(alts.length === 4, nome + 'questao ' + (q + 1) + ' tem 4 alternativas');
    alts[tema.quiz[q].correta].click();
    ok(!!document.querySelector('.explica.certa'), nome + 'questao ' + (q + 1) + ' aceitou a correta');
    document.querySelector('.quiz .btn').click();
  }
  var score = document.querySelector('.resultado .score');
  ok(score && score.textContent === total + '/' + total, nome + 'resultado mostra ' + total + '/' + total);
  var salvo = JSON.parse(localStorage.getItem('vand.progresso.v1'))[tema.id];
  ok(salvo && salvo.acertos === total, nome + 'progresso gravado no localStorage');

  // Refaz errando tudo: o melhor resultado nao pode piorar.
  document.querySelectorAll('.quiz .btn')[1].click();
  for (var q2 = 0; q2 < total; q2++) {
    var a2 = document.querySelectorAll('.quiz .alt');
    a2[(tema.quiz[q2].correta + 1) % 4].click();
    if (q2 === 0) ok(!!document.querySelector('.explica.errada'), nome + 'resposta errada sinalizada');
    document.querySelector('.quiz .btn').click();
  }
  var depois = JSON.parse(localStorage.getItem('vand.progresso.v1'))[tema.id];
  ok(depois.acertos === total,
     nome + 'refazer pior nao apaga o melhor resultado (ficou ' + depois.acertos + ')');
}

try {
  localStorage.removeItem('vand.progresso.v1');
  var trilha = window.VAND_CONTENT.trilha;
  var escritos = trilha.filter(function (t) { return t.secoes.length > 0; });
  var vazios = trilha.length - escritos.length;

  irPara('#/estudar');
  ok(document.querySelectorAll('.tema-card').length === trilha.length,
     'trilha lista os ' + trilha.length + ' temas');
  ok(document.querySelectorAll('.tema-card[disabled]').length === vazios,
     'os ' + vazios + ' temas ainda sem conteudo estao desabilitados');
  ok(escritos.length > 0, 'ha ao menos um Tema escrito para percorrer');

  escritos.forEach(percorre);

  // Abas vazias.
  irPara('#/alerta');
  ok(!!document.querySelector('.vazia'), 'aba Alerta mostra tela vazia assumida');
  irPara('#/registro');
  ok(!!document.querySelector('.vazia'), 'aba Registro mostra tela vazia assumida');

  // Volta a trilha: o selo de progresso aparece em cada Tema percorrido.
  irPara('#/estudar');
  ok(document.querySelectorAll('.selo-feito').length === escritos.length,
     'trilha mostra o resultado guardado dos ' + escritos.length + ' temas percorridos');
} catch (e) {
  log.push('FALHA excecao: ' + (e && e.message) + ' | ' + (e && e.stack || '').split('\n')[1]);
}
document.getElementById('saida').textContent = 'RESULTADO\n' + log.join('\n');
</script></body></html>
